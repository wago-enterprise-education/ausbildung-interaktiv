<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interaktive Lernangebote und HTML-Anwendungen von Deibele Bildung.">
    <title>Lernangebote | Deibele Bildung</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            color: #172033;
            background: #f3f6fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
        }

        main {
            width: min(100% - 2rem, 760px);
            margin: 0 auto;
            padding: 4rem 0;
        }

        .eyebrow {
            margin: 0 0 0.5rem;
            color: #3759a5;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 6vw, 3.25rem);
            line-height: 1.1;
        }

        .intro {
            margin: 1rem 0 2.5rem;
            color: #526078;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        h2 {
            margin: 0 0 1rem;
            font-size: 1.25rem;
        }

        .offer-list {
            display: grid;
            gap: 1rem;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .offer-link {
            display: block;
            padding: 1.25rem 1.5rem;
            border: 1px solid #dce3ef;
            border-radius: 0.75rem;
            background: #fff;
            color: inherit;
            text-decoration: none;
            transition: border-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
        }

        .offer-link:hover {
            transform: translateY(-2px);
            border-color: #8299ce;
            box-shadow: 0 8px 24px rgb(23 32 51 / 8%);
        }

        .offer-link:focus-visible {
            outline: 3px solid #3759a5;
            outline-offset: 3px;
        }

        .offer-link strong {
            display: block;
            margin-bottom: 0.35rem;
            color: #24458e;
            font-size: 1.1rem;
        }

        .offer-link span {
            color: #526078;
            line-height: 1.5;
        }

        footer {
            margin-top: 2rem;
            color: #6b778c;
            font-size: 0.9rem;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <p class="eyebrow">Deibele Bildung</p>
            <h1>Lernangebote</h1>
            <p class="intro">Interaktive Anwendungen und Materialien zum Lernen und Ausprobieren.</p>
        </header>

        <section aria-labelledby="angebote-heading">
            <h2 id="angebote-heading">Alle Angebote</h2>
            <ul class="offer-list">
                <li>
                    <a class="offer-link" href="Fehlerschleife.html">
                        <strong>Fehlerschleife im TN-S-Netz</strong>
                        <span>Spannungsfall und Fehlerschleifenimpedanz interaktiv berechnen.</span>
                    </a>
                </li>
                <!-- Weitere HTML-Angebote als <li> mit einem relativen Link ergänzen. -->
            </ul>
        </section>

        <footer>
            <p>Wähle ein Angebot aus, um es direkt zu öffnen.</p>
        </footer>
    </main>
</body>
</html>
